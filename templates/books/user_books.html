{% extends "base.html" %} {% block content %}

<div class="user_book_head">
  <h1>MY BOOKS</h1>
  <div class="search_form">
    <form method="GET">
      <input
        type="text"
        name="search"
        placeholder="Search by title or author"
        value="{{ request.GET.search|default:'' }}"
      />

      <button type="submit">SEARCH</button>
    </form>
  </div>
  <a href="{% url 'books:add_book' %}">
    <button type="button">ADD BOOK</button>
  </a>
</div>

{% if books %}

<div class="books_grid">
  {% for book in books %}

  <a href="{% url 'books:book_detail' book.id %}" class="book_card">
    {% if book.cover %}
    <img src="{{ book.cover.url }}" alt="{{ book.title }}" />
    {% else %}
    <div class="no_cover">No cover available.</div>
    {% endif %}

    <h6>{{ book.title }}</h6>
  </a>

  {% endfor %}
</div>

{% else %}

<h3>Nothing to show</h3>

{% endif %} {% endblock %}
